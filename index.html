<meta name="apple-mobile-web-app-title" content="Ritmo">
<title>Ritmo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: treinador calmo e direto, app de bolso
   IDEA: o painel de um relógio esportivo transformado em diário de atleta
   PICTURE: três anéis (calorias, proteína, água) com o score do dia no centro, sobre faixa verde-petróleo
   COLOUR and TYPE: petróleo dominante, laranja de energia, menta e violeta de apoio; Plus Jakarta Sans
   LAYOUT: coluna de app, cartões brancos sobre fundo neutro, abas fixas embaixo, folhas que sobem */
:root{color-scheme:light dark;
--bg:light-dark(#f3f4f1,#0a1210);--card:light-dark(#ffffff,#131d1a);--card2:light-dark(#eef1ee,#1b2824);
--ink:light-dark(#0d1f1c,#eef5f2);--mute:light-dark(#5d6d69,#9db0ab);--line:light-dark(#e4e8e5,#22322e);
--teal:light-dark(#0f4c45,#0f3f39);--teal2:light-dark(#0a3a34,#0a2d29);--tealInk:#f2fbf8;
--acc:light-dark(#ff6a3d,#ff7d55);--accSoft:light-dark(#ffe6dc,#3a2219);--mint:light-dark(#d4f1e6,#1d4038);--vio:light-dark(#ebe7ff,#2a2547);--blu:light-dark(#e1eefb,#1a2c3d);
--ok:light-dark(#127a55,#5ad1a0);--sh:light-dark(rgba(15,45,40,.07),rgba(0,0,0,0));
--s1:light-dark(#e0521f,#ec6235);--s2:light-dark(#00927f,#1f9d88);--s3:light-dark(#7d6fd0,#8b7ddc);--wa:light-dark(#3b8bd0,#5aa9e6);
--h0:light-dark(#e6ebe8,#1c2b27);--h1:light-dark(#b5ddd3,#1f4a40);--h2:light-dark(#5fb8a6,#237a69);--h3:light-dark(#0f8a77,#2fae95);--h4:light-dark(#0b4f45,#7be3cb)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;overflow-x:clip;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:active{transform:scale(.97)}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--teal);color:var(--tealInk)}
.top .date{flex:1;text-align:left;padding:4px 8px;border-radius:12px}
.top .date b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em;text-transform:capitalize}
.top .date small{display:block;font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.top .ic{background:rgba(255,255,255,.1)}
.ic svg{width:22px;height:22px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;background:#9fb}
.dot.local{background:#fc6}.dot.load{background:#ccc}
main{max-width:680px;margin:0 auto}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}*{transition:none!important}}
.hero{background:linear-gradient(180deg,var(--teal),var(--teal2));color:var(--tealInk);padding:4px 18px 26px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,138,99,.28),transparent 70%);pointer-events:none}
.hello{position:relative;z-index:1;margin-bottom:10px}
.hello small{opacity:.8;font-size:14px}.hello b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
.hgrid{position:relative;z-index:1;display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:center}
.rings{position:relative;width:170px;height:170px}
.rings svg{width:170px;height:170px;transform:rotate(-90deg)}
.rings .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rings .in b{font-size:38px;font-weight:800;line-height:1}.rings .in small{font-size:12px;opacity:.85}
.rl{display:grid;gap:12px}
.rl .r{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;align-items:start}
.rl i{width:12px;height:12px;border-radius:50%;margin-top:4px}
.rl small{display:block;font-size:13px;opacity:.8}.rl b{font-size:17px;font-weight:800;white-space:nowrap}.rl span{font-size:13px;opacity:.75}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:16px 16px 0}
.quick button{background:var(--card);border-radius:18px;padding:12px 4px;display:grid;justify-items:center;gap:6px;font-size:12.5px;font-weight:700;box-shadow:0 4px 14px var(--sh)}
.quick button span.ib{width:38px;height:38px;border-radius:12px}
.wrap{padding:16px;display:grid;gap:14px}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 6px 20px var(--sh)}
.ch{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px}
.ch h3{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px}
.ib{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);flex:none}
.ib svg{width:19px;height:19px}.ib.g{background:var(--mint);color:var(--s2)}.ib.v{background:var(--vio);color:var(--s3)}.ib.b{background:var(--blu);color:var(--wa)}
.sec{font-size:15px;font-weight:800;color:var(--mute);margin:10px 4px -4px}
.mute{color:var(--mute);font-size:14px}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.big small{font-size:15px;font-weight:600;color:var(--mute)}
.lbar{height:10px;border-radius:10px;background:var(--card2);overflow:hidden;margin:10px 0}
.lbar i{display:block;height:100%;border-radius:10px;transition:width .4s}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;min-height:40px;padding:8px 14px;border-radius:999px;background:var(--card2);font-weight:700;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.pbtn{min-height:50px;padding:12px 18px;border-radius:16px;background:var(--acc);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.pbtn.t{background:var(--teal)}.pbtn svg,.sbtn svg{width:20px;height:20px;flex:none}
.pbtn:disabled{opacity:.5}
.sbtn{min-height:46px;padding:10px 16px;border-radius:14px;background:var(--card2);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.lk{color:var(--acc);font-weight:800;font-size:14px;min-height:36px}
.danger{color:#d33a2c}
.list{display:grid;margin-top:4px}
.it{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);text-align:left;width:100%}
.it:first-child{border-top:0}
.it .nm{flex:1}.it .nm b{display:block;font-weight:700;font-size:15px}.it .nm small{color:var(--mute);font-size:13px}
.it .kc{font-weight:800;white-space:nowrap;text-align:right}.it .kc small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.mb{display:grid;gap:10px;margin-top:8px}
.mb .row div{display:flex;justify-content:space-between;gap:8px;font-size:14px}.mb .row b{white-space:nowrap}
.mb .bar{height:8px;border-radius:8px;background:var(--card2);overflow:hidden;margin-top:4px}.mb .bar i{display:block;height:100%;border-radius:8px}
.sug{background:var(--card2);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;margin-top:8px}

function score(x,g){

let idb=null;const purl={};
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('ritmo',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('docs'))d.createObjectStore('docs');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=idb.transaction(store,mode),rq=fn(t.objectStore(store));t.oncomplete=()=>res(rq&&'result' in rq?rq.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
function loadAll(){return new Promise((res,rej)=>{const o={},t=idb.transaction('docs','readonly'),c=t.objectStore('docs').openCursor();c.onsuccess=()=>{const k=c.result;if(k){o[k.key]=k.value;k.continue();}};t.oncomplete=()=>res(o);t.onerror=()=>rej(t.error);});}
async function loadPhotos(){for(const k of Object.keys(docs).filter(k=>k.startsWith('ph-'))){if(purl[k]||docs[k].src)continue;try{const b=await tx('photos','readonly',s=>s.get(k));if(b)purl[k]=URL.createObjectURL(b);}catch(e){}}}
function canWrite(){if(demo&&view==='progresso'){toast('Saia do modo exemplo para registrar');return false;}if(!ready){toast('Carregando seus dados, um instante…');return false;}return true;}
function save(id,data){docs[id]=data;render();if(idb)tx('docs','readwrite',s=>s.put(data,id)).catch(()=>toast('Não consegui salvar. Verifique o espaço do iPhone.'));else saveLocal();}
function del(id){delete docs[id];render();if(idb){tx('docs','readwrite',s=>s.delete(id)).catch(()=>{});if(id.startsWith('ph-'))tx('photos','readwrite',s=>s.delete(id)).catch(()=>{});}else saveLocal();if(purl[id]){URL.revokeObjectURL(purl[id]);delete purl[id];}}
function loadLocal(){try{docs=JSON.parse(localStorage.getItem('ritmo-v1')||'{}')||{};}catch(e){docs={};}}
function saveLocal(){try{localStorage.setItem('ritmo-v1',JSON.stringify(docs));}catch(e){toast('Memória cheia');}}
function goLocal(note){mode='local';ready=true;errNote=note||'';loadLocal();render();}
async function init(){
  render();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  try{
    idb=await idbOpen();docs=await loadAll();
    try{const old=JSON.parse(localStorage.getItem('ritmo-v1')||'null');if(old&&!Object.keys(docs).length){for(const k in old)await tx('docs','readwrite',s=>s.put(old[k],k));docs=old;}}catch(e){}
    mode='local';ready=true;render();await loadPhotos();render();
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){goLocal('Armazenamento limitado neste navegador');}
}
async function exportBackup(){
  toast('Preparando backup…');
  const ph={};for(const k of Object.keys(docs).filter(k=>k.startsWith('ph-'))){try{const b=await tx('photos','readonly',s=>s.get(k));if(b)ph[k]=await toDataURL(b);}catch(e){}}
  const meta=Object.assign({},docs.meta||{},{lastBackup:today()});
  const all=Object.assign({},docs,{meta});
  const file=new File([JSON.stringify({app:'ritmo',v:2,at:new Date().toISOString(),docs:all,ph})],`ritmo-backup-${today()}.json`,{type:'application/json'});
  let ok=false;
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Backup do Ritmo'});ok=true;}catch(e){if(e&&e.name==='AbortError')return;}}
  if(!ok){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}
  save('meta',meta);toast('Backup gerado. Guarde no Arquivos ou iCloud.');
}
async function importBackup(file){
  try{const j=JSON.parse(await file.text());if(!j||j.app!=='ritmo'||!j.docs)throw 0;
    for(const k in j.docs)await tx('docs','readwrite',s=>s.put(j.docs[k],k));
    for(const k in (j.ph||{})){const b=await (await fetch(j.ph[k])).blob();await tx('photos','readwrite',s=>s.put(b,k));}
    docs=await loadAll();await loadPhotos();render();toast('Backup restaurado');closeSheet();
  }catch(e){toast('Arquivo de backup inválido');}
}

/* gráficos SVG */
function niceMax(v){if(v<=0)return 1;const e=10**Math.floor(Math.log10(v)),m=v/e;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*e;}
function drawFig(fig){
  const sp=fig.__sp;if(!sp)return;const svg=fig.querySelector('svg'),W=svg.clientWidth,H=svg.clientHeight;if(!W)return;
  const pl=38,pr=10,pt=12,pb=24,n=sp.n,iw=W-pl-pr,ih=H-pt-pb,band=iw/n;
  const tops=[...(sp.bars||[]),...(sp.line||[]),...(sp.dots||[]),...(sp.lines?sp.lines.flatMap(l=>l.v):[]),sp.goal||0,...(sp.stack?sp.stack[0].v.map((_,i)=>sp.stack.reduce((s,x)=>s+(x.v[i]||0),0)):[])].filter(v=>v!=null);
  let lo=0,hi=Math.max(...tops,1),step;
  if(sp.fixed){[lo,hi,step]=sp.fixed;}
  else if(sp.min!=null){const vals=tops.filter(v=>v>0),a=Math.min(...vals),b=Math.max(...vals);step=niceMax(Math.max(b-a,1)/3);lo=Math.floor((a-step*.3)/step)*step;hi=Math.ceil((b+step*.3)/step)*step;}
  else{step=niceMax(hi/4);hi=Math.ceil(hi*1.04/step)*step;}
  const y=v=>pt+ih-(v-lo)/(hi-lo)*ih,x=i=>pl+band*i+band/2;
  const ticks=[];for(let t=lo;t<=hi+step/2;t+=step)ticks.push(Math.round(t*1000)/1000);
  let h=ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" class="grid"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" class="ax">${sp.fy?sp.fy(t):nf(t)}</text>`).join('');
  const bw=Math.max(1,Math.min(26,band-2));
  if(sp.bars)h+=sp.bars.map((v,i)=>v?`<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${Math.max(0,y(lo)-y(v))}" rx="${Math.min(4,bw/2)}" fill="var(--${sp.col})"/>`:'').join('');
  if(sp.stack)h+=sp.stack[0].v.map((_,i)=>{let acc=0;return sp.stack.map(s=>{const v=s.v[i]||0;if(!v)return '';const y1=y(acc+v),y0=y(acc);acc+=v;return `<rect x="${x(i)-bw/2}" y="${y1+1}" width="${bw}" height="${Math.max(0,y0-y1-2)}" rx="3" fill="var(--${s.col})"/>`;}).join('');}).join('');
  if(sp.goal)h+=`<line x1="${pl}" x2="${W-pr}" y1="${y(sp.goal)}" y2="${y(sp.goal)}" class="goal"/>`;
  const path=a=>{let d='',on=false;a.forEach((v,i)=>{if(v==null){on=false;return;}d+=(on?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1);on=true;});return d;};
  if(sp.lines)h+=sp.lines.map(l=>`<path d="${path(l.v)}" fill="none" stroke="var(--${l.col})" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  if(sp.line)h+=`<path d="${path(sp.line)}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(sp.dots)h+=sp.dots.map((v,i)=>v?`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="var(--s1)" stroke="var(--card)" stroke-width="2"/>`:'').join('');
  const every=Math.ceil(n/(W<420?5:7));
  h+=sp.labels.map((l,i)=>(i%every===0||i===n-1)&&!(i!==n-1&&n-1-i<every*.6)?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" class="ax">${l}</text>`:'').join('');
  h+=`<line class="cross" x1="0" x2="0" y1="${pt}" y2="${pt+ih}" style="display:none"/>`;
  svg.innerHTML=h;
  const tip=fig.querySelector('.tipbox'),cross=svg.querySelector('.cross');
  const hide=()=>{tip.style.display='none';cross.style.display='none';};
  const show=e=>{const r=svg.getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.floor((e.clientX-r.left-pl)/band)));const html=sp.tip(i);if(!html){hide();return;}
    cross.setAttribute('x1',x(i));cross.setAttribute('x2',x(i));cross.style.display='';tip.innerHTML=html;tip.style.display='block';
    const tw=tip.offsetWidth;tip.style.left=Math.max(0,Math.min(W-tw,x(i)-tw/2))+'px';};
  svg.onpointermove=show;svg.onpointerdown=show;svg.onpointerleave=e=>{if(e.pointerType==='mouse')hide();};
}
function mountFigs(){
  if(ro)ro.disconnect();
  const figs=document.querySelectorAll('#v-progresso .fig');if(!figs.length)return;
  const src=demo?makeDemo():docs,S=stats(src,period),g=S.g,lab=S.rows.map(r=>dm(r.d));
  const T=(r,extra)=>`<b>${dLong(r.d)}</b>${extra}`;
  const sm=a=>a.map((v,i)=>{const w=a.slice(Math.max(0,i-2),i+1).filter(x=>x!=null);return v==null&&!w.length?null:w.length?w.reduce((s,x)=>s+x,0)/w.length:null;});
  const en=S.rows.map(r=>r.feel&&r.feel.en?r.feel.en:null),re=S.rows.map(r=>r.feel&&r.feel.re?r.feel.re:null);
  const specs={
    kcal:{n:S.N,labels:lab,bars:S.rows.map(r=>r.log?r.k:null),col:'s2',line:S.ma,goal:g.kcal,tip:i=>{const r=S.rows[i];return T(r,r.log?`<br>${nf(r.k)} kcal (${Math.round(r.k/g.kcal*100)}% da meta)${S.ma[i]?`<br>média 7 dias: ${nf(S.ma[i])}`:''}`:'<br>sem registro');}},
    prot:{n:S.N,labels:lab,bars:S.rows.map(r=>r.log?r.p:null),col:'s1',goal:g.p,tip:i=>{const r=S.rows[i];return T(r,r.log?`<br>${nf(r.p)} g de proteína<br>${fmtQ(r1(r.p/(S.lastW||61)))} g/kg`:'<br>sem registro');}},
    agua:{n:S.N,labels:lab,bars:S.rows.map(r=>r.wa?r.wa/1000:null),col:'wa',goal:g.water/1000,fy:v=>fmtQ(r1(v)),tip:i=>{const r=S.rows[i];return T(r,r.wa?`<br>${fmtQ(r1(r.wa/100)/10)} L`:'<br>sem registro');}},
    peso:{n:S.N,labels:lab,dots:S.rows.map(r=>r.w),line:S.wma,min:1,fy:v=>fmtQ(r1(v)),tip:i=>{const r=S.rows[i];return r.w||S.wma[i]?T(r,`${r.w?`<br>pesagem: ${fmtQ(r.w)} kg`:''}${S.wma[i]?`<br>média 7 dias: ${fmtQ(r1(S.wma[i]))} kg`:''}`):'';}},
    sono:{n:S.N,labels:lab,bars:S.rows.map(r=>r.sl?r.sl.h:null),col:'s3',goal:g.sleep,fy:v=>fmtQ(v),tip:i=>{const r=S.rows[i];return T(r,r.sl?`<br>${fmtQ(r.sl.h)} h${r.sl.q?` · qualidade ${r.sl.q}/5`:''}`:'<br>sem registro');}},
    feel:{n:S.N,labels:lab,lines:[{v:sm(en),col:'s1'},{v:sm(re),col:'s2'}],fixed:[1,5,1],tip:i=>{const r=S.rows[i],f=r.feel||{};return f.en||f.re?T(r,`<br>Energia ${f.en||'–'} · Recuperação ${f.re||'–'}${f.fo?`<br>Fome ${f.fo} · Estresse ${f.es||'–'}`:''}`):'';}}
  };
  const nw=Math.ceil(S.N/7),wl=[],wv={M:[],C:[],O:[]};
  for(let k=0;k<nw;k++){const sl=S.rows.slice(Math.max(0,S.N-(nw-k)*7),S.N-(nw-k-1)*7);wl.push(dm(sl[0].d));
    const sum=t=>sl.reduce((s,r)=>s+r.wk.filter(w=>t(w.tp)).reduce((a,w)=>a+(w.min||0),0),0);
    wv.M.push(sum(t=>t==='Musculação'));wv.C.push(sum(t=>t==='Corrida'));wv.O.push(sum(t=>t!=='Musculação'&&t!=='Corrida'));}
  specs.treino={n:nw,labels:wl,stack:[{v:wv.M,col:'s2'},{v:wv.C,col:'s1'},{v:wv.O,col:'s3'}],tip:i=>`<b>Semana de ${wl[i]}</b><br>Musculação: ${wv.M[i]} min<br>Corrida: ${wv.C[i]} min${wv.O[i]?`<br>Outros: ${wv.O[i]} min`:''}`};
  const EH=exHistory(src)[forceEx]||[];
  if(EH.length){const hh=EH.slice(-40);specs.forca={n:hh.length,labels:hh.map(x=>dm(x.d)),dots:hh.map(x=>x.e),line:hh.map(x=>x.e),min:1,fy:v=>fmtQ(r1(v)),tip:i=>`<b>${dLong(hh[i].d)}</b><br>${hh[i].s[0]} × ${fmtQ(hh[i].s[1])} kg<br>1RM estimado: ${fmtQ(r1(hh[i].e))} kg`};}
  ro=new ResizeObserver(es=>es.forEach(e=>drawFig(e.target)));
  figs.forEach(f=>{f.__sp=specs[f.dataset.fig];if(f.__sp)ro.observe(f);});
}

function compress(file,max,q){
  return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*s);cv.height=Math.round(img.naturalHeight*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q);};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};img.src=url;});
}
const toDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});
$('#fileIn').addEventListener('change',async e=>{

    else{const b=await compress(file,800,.7);save(id,Object.assign(base,{src:await toDataURL(b)}));}
    upCap='';const ci=$('#capIn');if(ci)ci.value='';toast('Foto salva');
  }catch(err){toast('Não consegui salvar a foto');}
});

    case 'med':sheetMed();break;
    case 'medSave':{if(!canWrite())break;const x=d(),m={};['br','pe','ci','co'].forEach(k=>{const n=num($('#m_'+k).value);if(n)m[k]=r1(n);});x.med=Object.keys(m).length?m:null;put(x);closeSheet();toast('Medidas salvas');break;}
    case 'snack':{if(!canWrite())break;const sn=SNACKS.find(s=>s[0]===v);if(!sn)break;const meal=$('#sheet').classList.contains('on')?lastMeal:'Lanche';const x=d();snackItems(sn,meal).forEach(i=>x.items.push(i));put(x);if($('#sheet').classList.contains('on'))closeSheet();toast(v+' adicionado em '+meal);break;}
    case 'closeDay':sheetCloseDay();break;
    case 'copyClose':copyText(window.__closeTxt||'');break;
    case 'copyWeek':copyText(weekText());break;
    case 'bkOut':exportBackup();break;
    case 'bkIn':$('#bkIn').click();break;
    case 'wkNew':sheetWk(null);break;
    case 'wkEdit':{const w=d().wk.find(o=>o.id===id);if(w)sheetWk(w);break;}
    case 'wkT':wkD.tp=v;wkRefresh();break;
    case 'exDel':wkD.ex.splice(+b.dataset.i,1);wkRefresh();break;
    case 'setAdd':{const e2=wkD.ex[+b.dataset.i];const last=e2.sets[e2.sets.length-1]||[10,0];e2.sets.push(last.slice());wkRefresh();break;}
    case 'setDel':{const e2=wkD.ex[+b.dataset.i];e2.sets.splice(+b.dataset.j,1);wkRefresh();break;}
    case 'exAddOther':{const n=$('#exName').value.trim();if(n)addExercise(n.slice(0,50));break;}
    case 'wkSave':{if(!canWrite())break;const x=d(),w=Object.assign({},wkD);delete w.isNew;
      w.ex=(w.ex||[]).map(e2=>Object.assign({},e2,{sets:e2.sets.filter(s=>s[0]>0)})).filter(e2=>e2.sets.length);
      if(w.tp!=='Musculação')delete w.ex;if(w.tp!=='Musculação')delete w.rpe;else delete w.km;
      const i=x.wk.findIndex(o=>o.id===w.id);if(i>=0)x.wk[i]=w;else x.wk.push(w);x.rest=false;put(x);wkD=null;closeSheet();toast('Treino salvo');break;}
    case 'wkDel':{if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Toque de novo para apagar';break;}const x=d();x.wk=x.wk.filter(o=>o.id!==wkD.id);put(x);wkD=null;closeSheet();break;}
    case 'addFood':sheetAdd();break;
    case 'addFoodTo':lastMeal=v;sheetAdd();break;
    case 'meal':lastMeal=v;b.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));break;
    case 'qq':{$('#qn').value=v;$('#qu').value='u';updQ();break;}
    case 'pickFood':{const f=findFood(b.dataset.n);if(f)sheetQty(f,null);break;}
    case 'repeat':{if(!canWrite())break;const src=recents().find(i=>i.n===b.dataset.n);if(src){const x=d();x.items.push(Object.assign({},src,{id:uid(),m:lastMeal}));put(x);closeSheet();toast('Adicionado em '+lastMeal);}break;}
    case 'addItem':{if(!canWrite())break;const it=mkItem();if(!it.g){toast('Informe a quantidade');break;}const x=d();x.items.push(it);put(x);closeSheet();toast(nf(it.k)+' kcal em '+lastMeal);break;}
    case 'itEdit':{const it=d().items.find(i=>i.id===id);if(!it)break;const f=findFood(it.fk);
      if(f){lastMeal=it.m;sheetQty(f,it);}else openSheet(`<h2>${esc(it.n)}</h2><div class="st"><div class="prev"><div><b>${nf(it.k)}</b><small>kcal</small></div><div><b>${fmtQ(it.p)}</b><small>prot</small></div><div><b>${fmtQ(it.c)}</b><small>carb</small></div><div><b>${fmtQ(it.f)}</b><small>gord</small></div></div><p class="mute" style="margin:0">${esc(it.qt)} · ${esc(it.m)}${it.ai?' · estimado por IA':''}</p><button class="sbtn danger" data-act="itDel" data-id="${it.id}">Remover da refeição</button></div>`);break;}
    case 'saveEdit':{if(!canWrite())break;const x=d(),i=x.items.findIndex(o=>o.id===addState.editId);if(i<0)break;const it=mkItem();it.id=x.items[i].id;it.m=x.items[i].m;x.items[i]=it;put(x);closeSheet();break;}
    case 'itDel':{if(!canWrite())break;const x=d();x.items=x.items.filter(i=>i.id!==id);put(x);closeSheet();toast('Removido');break;}
    case 'copyY':{if(!canWrite())break;const y=day(addDays(cur,-1)),x=d();y.items.forEach(i=>x.items.push(Object.assign({},i,{id:uid()})));put(x);toast('Refeições de ontem copiadas');break;}
    case 'saveCombo':{if(!canWrite())break;const its=d().items.filter(i=>i.m===v);if(!its.length)break;const list=combos();const nm=v+' ('+its.slice(0,2).map(i=>i.n.split(' ')[0]).join(', ')+(its.length>2?'…':'')+')';list.push({id:uid(),n:nm,items:its.map(i=>Object.assign({},i,{id:undefined}))});save('combos',{list});toast('Combo salvo');break;}
    case 'combos':sheetCombos();break;
    case 'useCombo':{if(!canWrite())break;const c=combos().find(o=>o.id===id);if(!c)break;const x=d();c.items.forEach(i=>x.items.push(Object.assign({},i,{id:uid(),m:lastMeal})));put(x);closeSheet();toast('Combo adicionado em '+lastMeal);break;}
    case 'delCombo':{if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Apagar?';break;}save('combos',{list:combos().filter(o=>o.id!==id)});sheetCombos();break;}
    case 'newFood':sheetNewFood();break;
    case 'saveFood':{if(!canWrite())break;const n=$('#nfN').value.trim(),u=$('#nfU').value.trim()||'porção';
      if(!n||$('#nfK').value===''){toast('Preencha nome e calorias');break;}
      if(allFoods().some(f=>norm(f[0])===norm(n))){toast('Já existe um alimento com esse nome');break;}
      const list=customs();list.push([n,num($('#nfK').value),num($('#nfP').value),num($('#nfC').value),num($('#nfF').value),u,100,num($('#nfFi').value)]);save('foods',{list});sheetQty(list[list.length-1],null);break;}
    case 'ai':if(b.dataset.off){toast('A estimativa por IA funciona quando o app é aberto pelo Claude');break;}sheetAI();break;
    case 'aiPhoto':$('#aiFile').click();break;
    case 'aiRun':if(sample)runAI();break;
    case 'aiAdd':{if(!canWrite()||!aiResult)break;const x=d();aiResult.forEach(i=>x.items.push(Object.assign({},i,{m:lastMeal})));put(x);closeSheet();toast('Refeição adicionada');break;}
    case 'upCat':upCat=v;render();break;
    case 'pick':if(canWrite())$('#fileIn').click();break;
    case 'phF':photoFilter=v;render();break;
    case 'phOpen':{const p=photos().find(x=>x.id===id);if(p)openViewer(p);break;}
    case 'vClose':$('#viewer').classList.remove('on');break;
    case 'phDel':{if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Confirmar';break;}del(id);$('#viewer').classList.remove('on');toast('Foto apagada');break;}
    case 'lc':learnCat=v;render();break;
    case 'readT':{if(!ready)break;const rd=readList().slice(),i=rd.indexOf(v);if(i>=0)rd.splice(i,1);else rd.push(v);save('learn',{read:rd});break;}
    case 'per':period=Number(v);render();break;
    case 'demo':demo=!demo;render();break;
    case 'hc':{const pr=v.split('|');toast(dLong(pr[0])+(pr[1]==='-1'?': sem registro':': score '+pr[1]));break;}
    case 'suggest':{const W=weights(docs),w=W.length?W[W.length-1].w:61,h=num($('#cH').value)||180,ag=num($('#cA').value)||19;
      const bmr=10*w+6.25*h-5*ag+5,k=Math.round((bmr*1.6+350)/50)*50,p=Math.round(2*w),f=Math.round(k*.27/9),c=Math.round((k-p*4-f*9)/4),wa=Math.round((35*w+700)/100)*100;
      $('#cK').value=k;$('#cP').value=p;$('#cF').value=f;$('#cC').value=c;$('#cW').value=wa;toast('Sugestão preenchida, revise e salve');break;}
    case 'habAdd':{const n=$('#habNew').value.trim();if(!n)break;const g=cfg(),H=(g.habits||[]).slice();H.push({id:'h'+uid(),n:n.slice(0,40)});if(!canWrite())break;save('cfg',Object.assign({},docs.cfg||{},{habits:H}));sheetCfg();break;}
    case 'habDel':{const g=cfg(),H=(g.habits||[]).filter(h=>h.id!==id);if(!canWrite())break;save('cfg',Object.assign({},docs.cfg||{},{habits:H}));sheetCfg();break;}
    case 'cfgSave':{if(!canWrite())break;const n=s=>Math.max(0,num($(s).value));const g=cfg();
      const o=Object.assign({},docs.cfg||{},{kcal:Math.round(n('#cK'))||DEF.kcal,p:Math.round(n('#cP'))||DEF.p,c:Math.round(n('#cC'))||DEF.c,f:Math.round(n('#cF'))||DEF.f,fi:Math.round(n('#cFi'))||DEF.fi,water:Math.round(n('#cW'))||DEF.water,sleep:n('#cS')||DEF.sleep,h:Math.round(n('#cH'))||DEF.h,age:Math.round(n('#cA'))||DEF.age,target:n('#cT')||DEF.target,habits:g.habits,name:$('#cN').value.trim().slice(0,24)});
      save('cfg',o);closeSheet();toast('Metas salvas');break;}
  }
});
window.addEventListener('hashchange',route);
route();
init();
}
</script>
